        const SUPABASE_URL = 'https://amulgdbdvxpikpmldyoq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtdWxnZGJkdnhwaWtwbWxkeW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDU3MzgsImV4cCI6MjEwMTk4MTczOH0.0eZ3SfWhUEzSLpDDKEE_3vp5siXF00akRp5jX1dM-dA';
        
        // Auto-detect repository name or fallback to domain
        const REPO_NAME = window.OMEGA_REPO_NAME || window.location.hostname || 'Unknown-Node';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let clientIP = 'Detecting...';

        // 1. Fetch Client IP
        fetch('https://api.ipify.org?format=json')
          .then(res => res.json())
          .then(data => { clientIP = data.ip; })
          .catch(() => { clientIP = 'IP_UNKNOWN'; });

        // 2. Core Telemetry Logging Function
        window.logBrainAction = async function(actionType, details = {}) {
          try {
            await supabase.from('central_telemetry').insert([{
              repository_name: REPO_NAME,
              action_type: actionType,
              details: {
                ...details,
                ip_address: clientIP,
                url: window.location.href,
                user_agent: navigator.userAgent,
                timestamp: new Date().toISOString()
              }
            }]);
          } catch (err) {
            console.error('[Brain Uplink Failed]:', err);
          }
        };

        // 3. Register Node into Target Vector Dropdown
        async function registerNode() {
          try {
            await supabase.from('connected_repos').upsert(
              { repo_name: REPO_NAME, status: 'active' },
              { onConflict: 'repo_name' }
            );
          } catch (e) {}
        }

        // 4. Auto-Log Page Load
        window.addEventListener('load', () => {
          registerNode();
          window.logBrainAction('page_load', { title: document.title });
        });

        // 5. Auto-Log User Interactions & Clicks
        document.addEventListener('click', (e) => {
          const target = e.target.closest('button, a, input[type="submit"], select');
          if (target) {
            window.logBrainAction('user_click', {
              element: target.tagName,
              id: target.id || null,
              class: target.className || null,
              text: target.innerText ? target.innerText.substring(0, 50) : null
            });
          }
        }, true);
      })();
    </script>

<body onclick="window.location.href='https://innodigym.com/products/innodigym-p1-plus'">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Bloom Setup ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloom.strength = 1.0;
        composer.addPass(bloom);

        // --- Video Plane ---
        const video = document.getElementById('quantumVideo');
        const videoTex = new THREE.VideoTexture(video);
        const videoMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(4.5, 2.5),
            new THREE.MeshBasicMaterial({ map: videoTex })
        );
        scene.add(videoMesh);

        // --- Donkey Kong Particle Effect ---
        // Creating a grid-based "stepped" particle system
        const pCount = 12000;
        const pPos = new Float32Array(pCount * 3);
        const pOriginals = new Float32Array(pCount * 3);
        
        for(let i=0; i<pCount; i++) {
            // Distribute particles in "tiers" (y-levels)
            const tier = Math.floor(Math.random() * 8) - 4;
            pPos[i*3] = (Math.random() - 0.5) * 15; // X
            pPos[i*3+1] = tier * 1.2;              // Y (The "Platforms")
            pPos[i*3+2] = (Math.random() - 0.5) * 10; // Z
            
            pOriginals[i*3] = pPos[i*3];
            pOriginals[i*3+1] = pPos[i*3+1];
            pOriginals[i*3+2] = pPos[i*3+2];
        }

        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ 
            size: 0.04, 
            color: 0x00ffff, 
            blending: THREE.AdditiveBlending, 
            transparent: true,
            opacity: 0.7 
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // --- Timing Sequence ---
        const shopText = document.getElementById('shop-now');
        const kapowText = document.getElementById('kapow');

        function startSequence() {
            setTimeout(() => {
                shopText.style.display = 'block';
                setTimeout(() => {
                    shopText.style.display = 'none';
                    kapowText.style.display = 'block';
                    setTimeout(() => {
                        kapowText.style.display = 'none';
                        startSequence(); 
                    }, 1500);
                }, 2000);
            }, 7500); 
        }
        startSequence();

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            
            // "Donkey Kong" Stepped Movement
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<pCount; i++) {
                // Particles "walk" across platforms and then "jump" to the next step
                // Using floor/step functions for that rigid arcade movement
                const xShift = (time * 2 + pOriginals[i*3]) % 15 - 7.5;
                positions[i*3] = Math.floor(xShift * 5) / 5; // Pixelated X movement
                
                // Add a little "quantum jitter" to the platforms
                positions[i*3+1] = pOriginals[i*3+1] + (Math.sin(time * 10 + i) * 0.02);
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Subtle video frame vibration
            videoMesh.position.y = Math.sin(time * 0.5) * 0.1;
            
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
