<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH ECHO // NEON CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --btn-size: clamp(120px, 38vw, 180px);     /* scales between ~120–180px */
            --grid-gap:  clamp(1rem,  4vw,  2.5rem);
            --container-pad: clamp(1.25rem, 5vw, 2.5rem);
            --max-container: 480px;
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: #00f0ff;
            overflow: hidden;
            min-height: 100dvh;           /* better mobile support */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Starfield */
        #stars {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at bottom, #0b001f 0%, #000 100%);
            z-index: -2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            animation: twinkle 6s infinite alternate;
        }

        @keyframes twinkle {
            0%,100% { opacity: 0.4; }
            50%     { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: min(92%, var(--max-container));
            background: rgba(3, 10, 30, 0.65);
            border: 1px solid #00f0ff33;
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 60px #00f0ff44, inset 0 0 30px #ff00aa22;
            padding: var(--container-pad);
            margin: 1rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-shadow: 0 0 20px #ff00aa, 0 0 40px #00f0ff;
            letter-spacing: clamp(4px, 1.8vw, 8px);
            background: linear-gradient(90deg, #ff00aa, #00f0ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(2rem, 7vw, 3.5rem);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .neon-text {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        #level-display {
            font-size: clamp(1.25rem, 4.5vw, 1.75rem);
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--grid-gap);
            width: calc(2 * var(--btn-size) + var(--grid-gap));
            max-width: 100%;
            margin: 0 auto 2.5rem;
        }

        .game-button {
            height: var(--btn-size);
            width: var(--btn-size);
            border-radius: 1.2rem;
            transition: all 0.15s ease;
            cursor: pointer;
            border: 3px solid;
            box-shadow: 0 0 25px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation; /* better mobile feel */
        }

        .game-button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-button.highlight::after,
        .game-button:active::after {
            opacity: 1;
        }

        #btn-0 { background: #ff0066; border-color: #ff3399; box-shadow: 0 0 30px #ff0066aa; }
        #btn-1 { background: #00d4ff; border-color: #00f0ff; box-shadow: 0 0 30px #00d4ffaa; }
        #btn-2 { background: #39ff14; border-color: #66ff33; box-shadow: 0 0 30px #39ff14aa; }
        #btn-3 { background: #ffe700; border-color: #ffff00; box-shadow: 0 0 30px #ffe700aa; }

        .game-button.highlight, .game-button:active {
            transform: scale(1.08);
            box-shadow: 0 0 60px 15px currentColor !important;
            filter: brightness(1.4);
        }

        #message-box {
            min-height: 5.5rem;
            font-family: 'VT323', monospace;
            font-size: clamp(1.25rem, 4.8vw, 1.75rem);
            text-shadow: 0 0 12px #00f0ff;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .glitch {
            animation: glitch 1.2s infinite;
        }

        @keyframes glitch {
            0%   { text-shadow: 2px 0 #ff00aa, -2px 0 #00f0ff; }
            20%  { text-shadow: -2px 0 #ff00aa, 2px 0 #00f0ff; }
            40%  { text-shadow: 2px 0 #00f0ff, -2px 0 #ff00aa; }
            60%  { text-shadow: -4px 0 #ff00aa, 4px 0 #00f0ff; }
            80%  { text-shadow: 4px 0 #00f0ff, -4px 0 #ff00aa; }
            100% { text-shadow: 2px 0 #ff00aa, -2px 0 #00f0ff; }
        }

        /* Scanlines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0,0,0,0.18) 2px,
                rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.35;
        }

        #start-button {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            padding: clamp(0.9rem, 3.5vw, 1.3rem) clamp(2rem, 8vw, 3.5rem);
        }
    </style>
</head>
<body>

<div id="stars"></div>

<div class="container">
    <h1 class="tracking-widest">ZENITH ECHO</h1>
    <div id="level-display" class="text-center mb-6 neon-text">LEVEL 1 / 10</div>

    <div id="game-grid" class="mb-10">
        <div id="btn-0" class="game-button" data-color="Magenta"></div>
        <div id="btn-1" class="game-button" data-color="Cyan"></div>
        <div id="btn-2" class="game-button" data-color="Acid"></div>
        <div id="btn-3" class="game-button" data-color="Toxic"></div>
    </div>

    <div id="message-box" class="transition-colors duration-500">
        INITIATE NEON CORE → PRESS START
    </div>

    <div class="flex justify-center">
        <button id="start-button" 
                class="bg-black/60 hover:bg-black/80 border-2 border-[#00f0ff] text-[#00f0ff] font-bold rounded-full transition-all duration-300 shadow-[0_0_25px_#00f0ff88] hover:shadow-[0_0_45px_#00f0ffff]"
                onclick="startGame()">
            ACTIVATE
        </button>
    </div>
</div>

<script>
// Starfield (unchanged)
function createStars() {
    const starsDiv = document.getElementById('stars');
    for (let i = 0; i < 180; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 0.8;
        star.style.width = star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 5 + 's';
        starsDiv.appendChild(star);
    }
}
createStars();

// Audio, game logic, etc. remain unchanged from your previous version
// ────────────────────────────────────────────────────────────────
// (paste your full <script> content here – tones, handleInput, startGame, etc.)
// For brevity I'm only showing the structural/responsive part above

// Events (updated slightly)
window.onload = () => {
    const buttons = [
        document.getElementById('btn-0'),
        document.getElementById('btn-1'),
        document.getElementById('btn-2'),
        document.getElementById('btn-3')
    ];

    buttons.forEach((btn, idx) => {
        btn.addEventListener('click', () => handleInput(idx));
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            handleInput(idx);
        });
    });

    // Optional: force layout recalc on orientation change / resize
    window.addEventListener('resize', () => {
        document.documentElement.style.setProperty('--btn-size', 'clamp(120px, 38vw, 180px)');
    });
};

// Your existing game logic goes here ↓
// const audioCtx = ...
// const TONES = ...
// function playTone ...
// ... rest of your script ...
</script>
</body>
</html>
