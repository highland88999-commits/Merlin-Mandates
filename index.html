<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH ECHO // NEON CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --btn-size: clamp(120px, 38vw, 180px);
            --grid-gap:  clamp(1rem,  4vw,  2.5rem);
            --container-pad: clamp(1.25rem, 5vw, 2.5rem);
            --max-container: 480px;
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: #00f0ff;
            overflow: hidden;
            min-height: 100dvh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-video-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #intro-video-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #stars {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at bottom, #0b001f 0%, #000 100%);
            z-index: -2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            animation: twinkle 6s infinite alternate;
        }

        @keyframes twinkle {
            0%,100% { opacity: 0.4; }
            50%     { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: min(92%, var(--max-container));
            background: rgba(3, 10, 30, 0.65);
            border: 1px solid #00f0ff33;
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 60px #00f0ff44, inset 0 0 30px #ff00aa22;
            padding: var(--container-pad);
            margin: 1rem;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease, transform 1s ease;
        }

        .container.visible {
            opacity: 1;
            transform: scale(1);
        }

        h1 {
            font-weight: 900;
            text-shadow: 0 0 20px #ff00aa, 0 0 40px #00f0ff;
            letter-spacing: clamp(4px, 1.8vw, 8px);
            background: linear-gradient(90deg, #ff00aa, #00f0ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(2rem, 7vw, 3.5rem);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .neon-text {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        #level-display {
            font-size: clamp(1.25rem, 4.5vw, 1.75rem);
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--grid-gap);
            width: calc(2 * var(--btn-size) + var(--grid-gap));
            max-width: 100%;
            margin: 0 auto 2.5rem;
        }

        .game-button {
            height: var(--btn-size);
            width: var(--btn-size);
            border-radius: 1.2rem;
            transition: all 0.15s ease;
            cursor: pointer;
            border: 3px solid;
            box-shadow: 0 0 25px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-button.highlight::after,
        .game-button:active::after {
            opacity: 1;
        }

        #btn-0 { background: #ff0066; border-color: #ff3399; box-shadow: 0 0 30px #ff0066aa; }
        #btn-1 { background: #00d4ff; border-color: #00f0ff; box-shadow: 0 0 30px #00d4ffaa; }
        #btn-2 { background: #39ff14; border-color: #66ff33; box-shadow: 0 0 30px #39ff14aa; }
        #btn-3 { background: #ffe700; border-color: #ffff00; box-shadow: 0 0 30px #ffe700aa; }

        .game-button.highlight, .game-button:active {
            transform: scale(1.08);
            box-shadow: 0 0 60px 15px currentColor !important;
            filter: brightness(1.4);
        }

        #message-box {
            min-height: 5.5rem;
            font-family: 'VT323', monospace;
            font-size: clamp(1.25rem, 4.8vw, 1.75rem);
            text-shadow: 0 0 12px #00f0ff;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .glitch {
            animation: glitch 1.2s infinite;
        }

        @keyframes glitch {
            0%   { text-shadow: 2px 0 #ff00aa, -2px 0 #00f0ff; }
            20%  { text-shadow: -2px 0 #ff00aa, 2px 0 #00f0ff; }
            40%  { text-shadow: 2px 0 #00f0ff, -2px 0 #ff00aa; }
            60%  { text-shadow: -4px 0 #ff00aa, 4px 0 #00f0ff; }
            80%  { text-shadow: 4px 0 #00f0ff, -4px 0 #ff00aa; }
            100% { text-shadow: 2px 0 #ff00aa, -2px 0 #00f0ff; }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px);
            pointer-events: none;
            z-index: 9999;
            opacity: 0.35;
        }

        #start-button {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            padding: clamp(0.9rem, 3.5vw, 1.3rem) clamp(2rem, 8vw, 3.5rem);
        }

        #bg-music {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<!-- Intro Epic Video Overlay – now loops -->
<div id="intro-video-overlay">
    <video id="intro-video" playsinline loop>
        <source src="https://www.dropbox.com/scl/fi/tux4yrgc7577y60xhr4xs/Make_it_epic._H.mp4?rlkey=9rzhb0xtqx6tvp591nermwfj3&st=4l98ueb2&raw=1" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div style="position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: #00f0ff; font-size: 1.5rem; text-shadow: 0 0 10px #00f0ff; pointer-events: none;">
        CLICK ANYWHERE TO START → CLICK AGAIN TO ENTER NEON CORE
    </div>
</div>

<div id="stars"></div>

<!-- YouTube Playlist – attempting unmuted autoplay -->
<iframe id="bg-music" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<div class="container" id="game-container">
    <h1 class="tracking-widest">ZENITH ECHO</h1>
    <div id="level-display" class="text-center mb-6 neon-text">LEVEL 1 / 10</div>

    <div id="game-grid" class="mb-10">
        <div id="btn-0" class="game-button" data-color="Magenta"></div>
        <div id="btn-1" class="game-button" data-color="Cyan"></div>
        <div id="btn-2" class="game-button" data-color="Acid"></div>
        <div id="btn-3" class="game-button" data-color="Toxic"></div>
    </div>

    <div id="message-box" class="transition-colors duration-500">
        INITIATE NEON CORE → PRESS ACTIVATE
    </div>

    <div class="flex justify-center">
        <button id="start-button" 
                class="bg-black/60 hover:bg-black/80 border-2 border-[#00f0ff] text-[#00f0ff] font-bold rounded-full transition-all duration-300 shadow-[0_0_25px_#00f0ff88] hover:shadow-[0_0_45px_#00f0ffff]"
                onclick="startGame()">
            ACTIVATE
        </button>
    </div>
</div>

<script>
// Starfield
function createStars() {
    const starsDiv = document.getElementById('stars');
    for (let i = 0; i < 180; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 0.8;
        star.style.width = star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 5 + 's';
        starsDiv.appendChild(star);
    }
}
createStars();

// Video + Music Logic
const videoOverlay = document.getElementById('intro-video-overlay');
const introVideo = document.getElementById('intro-video');
const gameContainer = document.getElementById('game-container');

let firstInteractionDone = false;

videoOverlay.addEventListener('click', () => {
    if (!firstInteractionDone) {
        // First click: start video (will loop)
        introVideo.play().catch(() => {
            // Some browsers may still mute → user may need to interact again
        });
        firstInteractionDone = true;
    } else {
        // Second click: hide video, show game, start music
        videoOverlay.classList.add('hidden');
        gameContainer.classList.add('visible');
        startBackgroundMusic();
    }
});

// Background Music – trying to start unmuted
function startBackgroundMusic() {
    const playlistId = 'PLkmghnJPShXQl0i53iD4BIX2IR3MOsBRw';
    const randomIndex = Math.floor(Math.random() * 50) + 1; // fake random start

    const src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1&mute=0&loop=1&playlist=${playlistId}&index=${randomIndex}&controls=0&showinfo=0&rel=0&modestbranding=1&enablejsapi=1`;

    const iframe = document.getElementById('bg-music');
    iframe.src = src;

    // Optional: attempt to unmute via postMessage after load (limited success)
    iframe.addEventListener('load', () => {
        try {
            iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        } catch (e) {}
    });
}

// ────────────────────────────────────────────────
// Game Logic (no sound on buttons)
// ────────────────────────────────────────────────

let currentLevel = 1;
let sequence = [];
let playerInputIndex = 0;
let isPlayerTurn = false;
let isDisplaying = false;
let inputStartTime = 0;
let timeoutId;

const levelDisplay = document.getElementById('level-display');
const messageBox = document.getElementById('message-box');
const startButton = document.getElementById('start-button');
const buttons = [
    document.getElementById('btn-0'),
    document.getElementById('btn-1'),
    document.getElementById('btn-2'),
    document.getElementById('btn-3')
];

const BASE_DELAY = 520;
const BASE_SEQUENCE = 2;
const BASE_INPUT_TIME = 1100;

const DIFFICULTY = {
    1:  { length: BASE_SEQUENCE,     input_time_per_step: BASE_INPUT_TIME },
    2:  { length: BASE_SEQUENCE + 1, input_time_per_step: BASE_INPUT_TIME - 90 },
    3:  { length: BASE_SEQUENCE + 2, input_time_per_step: BASE_INPUT_TIME - 180 },
    4:  { length: BASE_SEQUENCE + 3, input_time_per_step: BASE_INPUT_TIME - 270 },
    5:  { length: BASE_SEQUENCE + 4, input_time_per_step: BASE_INPUT_TIME - 360 },
    6:  { length: BASE_SEQUENCE + 5, input_time_per_step: BASE_INPUT_TIME - 450 },
    7:  { length: BASE_SEQUENCE + 6, input_time_per_step: BASE_INPUT_TIME - 540 },
    8:  { length: BASE_SEQUENCE + 7, input_time_per_step: BASE_INPUT_TIME - 630 },
    9:  { length: BASE_SEQUENCE + 8, input_time_per_step: 320 },
    10: { length: 25,                input_time_per_step: 280 }
};

function highlightButton(index) {
    const btn = buttons[index];
    btn.classList.add('highlight');
    if (navigator.vibrate) navigator.vibrate(60);
    setTimeout(() => btn.classList.remove('highlight'), BASE_DELAY * 0.7);
}

function generateSequence(level) {
    const len = DIFFICULTY[level].length;
    sequence = Array.from({length: len}, () => Math.floor(Math.random() * 4));
}

function displaySequence() {
    isDisplaying = true;
    messageBox.textContent = `NEURAL SYNC → LEVEL ${currentLevel}`;
    messageBox.classList.add('neon-text');

    let i = 0;
    const interval = setInterval(() => {
        if (i < sequence.length) {
            highlightButton(sequence[i]);
            i++;
        } else {
            clearInterval(interval);
            isDisplaying = false;
            playerTurn();
        }
    }, BASE_DELAY);
}

function playerTurn() {
    isPlayerTurn = true;
    playerInputIndex = 0;
    inputStartTime = Date.now();

    const timeLimit = sequence.length * DIFFICULTY[currentLevel].input_time_per_step;

    messageBox.textContent = currentLevel < 10
        ? `REPLICATE ${sequence.length} NEON PULSES`
        : "ZENITH OVERLOAD → BREAK THE MATRIX";

    timeoutId = setTimeout(() => {
        if (isPlayerTurn) gameOver("LINK TIMEOUT");
    }, timeLimit);
}

function handleInput(index) {
    if (!isPlayerTurn || isDisplaying) return;

    if (currentLevel === 10 && playerInputIndex === 0) {
        const elapsed = Date.now() - inputStartTime;
        const target = 100;
        const tolerance = 6;

        if (index !== sequence[0] && elapsed >= target - tolerance && elapsed <= target + tolerance) {
            clearTimeout(timeoutId);
            isPlayerTurn = false;
            celebrateWin("ZENITH BREAK → 100ms PHANTOM TIMING ACHIEVED");
            return;
        }
    }

    highlightButton(index);

    if (index === sequence[playerInputIndex]) {
        playerInputIndex++;
        if (playerInputIndex === sequence.length) {
            isPlayerTurn = false;
            clearTimeout(timeoutId);
            messageBox.textContent = `CORE ${currentLevel} STABILIZED → NEXT LAYER`;
            setTimeout(nextLevel, 1400);
        }
    } else {
        gameOver(`CRC ERROR at pulse ${playerInputIndex + 1}`);
    }
}

function startGame() {
    startButton.disabled = true;
    startButton.textContent = "LIVE";
    currentLevel = 1;
    levelDisplay.textContent = `LEVEL ${currentLevel} / 10`;
    messageBox.textContent = "NEURAL INTERFACE ONLINE...";
    setTimeout(playLevel, 1200);
}

function playLevel() {
    playerInputIndex = 0;
    clearTimeout(timeoutId);
    levelDisplay.textContent = `LEVEL ${currentLevel} / 10`;
    generateSequence(currentLevel);
    displaySequence();
}

function nextLevel() {
    currentLevel++;
    if (currentLevel > 10) {
        finalWin();
    } else {
        playLevel();
    }
}

function gameOver(reason) {
    clearTimeout(timeoutId);
    isPlayerTurn = false;
    isDisplaying = false;
    messageBox.innerHTML = `<span class="text-[#ff0066] glitch font-extrabold">CORE BREACH</span><br>${reason}<br>DEPTH ${currentLevel}`;
    startButton.disabled = false;
    startButton.textContent = "REBOOT";
    currentLevel = 1;
}

function celebrateWin(message) {
    levelDisplay.textContent = "MATRIX SHATTERED";
    messageBox.innerHTML = `<span class="text-[#ffe700] glitch font-extrabold">NEON ASCENSION</span><br>${message}`;
    startButton.disabled = true;
    startButton.textContent = "LEGEND";

    buttons.forEach((btn, i) => {
        setTimeout(() => {
            btn.classList.add('highlight');
            btn.style.transform = 'rotate(360deg) scale(1.15)';
            setTimeout(() => {
                btn.classList.remove('highlight');
                btn.style.transform = '';
            }, 680);
        }, i * 140);
    });
}

function finalWin() {
    celebrateWin("YOU TRANSCENDED ALL LAYERS → TRUE ZENITH");
}

// Events
window.onload = () => {
    buttons.forEach((btn, idx) => {
        btn.addEventListener('click', () => handleInput(idx));
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            handleInput(idx);
        });
    });

    window.addEventListener('resize', () => {
        document.documentElement.style.setProperty('--btn-size', 'clamp(120px, 38vw, 180px)');
    });
};
</script>
</body>
</html>
